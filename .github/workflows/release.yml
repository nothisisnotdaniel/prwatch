# Builds PRWatch for macOS on Apple silicon from one release commit, in four jobs (a macOS-only, stable-only
# subset of ControlRoom's release.yml):
# - version checks the event and works out the release version and commit.
# - macos-tests needs version: it restores (RoomKit from GitHub Packages), checks the RoomKit package, builds with
#   -warnaserror and runs every test on the release commit (the normal build, version "dev").
# - macos needs version and macos-tests: it publishes the self-contained osx-arm64 build with the release
#   version, smoke-checks its version, packs the tarball, reports its SHA-256 as the job output tarball_sha256
#   and uploads only the tarball as an artifact.
# - release needs version and macos. It downloads the artifact, checks that dist/ holds exactly the tarball and
#   that its hash is the one macos reported, then sums, attests and publishes it. Only this job has write
#   permissions, and it builds nothing itself. The hash check catches a file swapped or changed between jobs; it
#   cannot catch a compromised build job, which reports its own hash.
# - A merged pull request from develop into main, titled "release vX.Y.Z", makes a release: vX.Y.Z (and its tag)
#   on the merge commit (.github/scripts/release-version.sh). Closed-unmerged PRs, PRs from other branches and
#   fork PRs are skipped by the version job's if:, and its first step checks the same again.
# - The release holds prwatch-<version>-osx-arm64.tar.gz (one top folder prwatch-<version>-osx-arm64/ with the
#   self-contained publish output, wwwroot/ included, plus updater.sh once scripts/updater.sh exists) and
#   SHA256SUMS, plus a build-provenance attestation for the tarball (check it with:
#   gh attestation verify <tarball> --repo nothisisnotdaniel/prwatch).
# - The builds are only ad-hoc signed (no signing certificate yet).
# macos-tests and macos have only contents: read and packages: read; the GITHUB_TOKEN reaches dotnet only on their
# Restore steps (NuGetPackageSourceCredentials_github), and gh only on "Check the RoomKit package", which pins the
# restored package's bytes (roomkit.sha256) and checks its attestation from roomkit's release.yml on main before
# any build imports the package.
# PR fields, job outputs and the token reach the shell only through env: blocks, never through ${{ }} inside a
# run: script. Actions are pinned to full commit SHAs (the tag each one had is in the trailing comment), so a
# moved tag cannot run new code with the contents: write token.
name: Release

on:
  pull_request:
    types:
      - "closed"
    branches:
      - "main"

permissions: {}

jobs:
  version:
    # Runs only for a merged PR from develop in this repository.
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository
    # macos-15 is an Apple silicon (arm64) runner; the first step checks it.
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.version.outputs.RELEASE_VERSION }}
      release_target: ${{ steps.version.outputs.RELEASE_TARGET }}
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_MERGED: ${{ github.event.pull_request.merged }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No later step needs git credentials, so no token is left in .git/config.
          persist-credentials: false
          # All history and tags: the tags are read by release-version.sh, and the merge commit is checked
          # against origin/main.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Check the event
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "The runner is not arm64" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "Only a merged release pull request makes a release" >&2
            exit 1
          fi
          if [ "$PR_MERGED" != "true" ]; then
            echo "Pull request is not merged; nothing to release" >&2
            exit 1
          fi
          if [ "$PR_HEAD_REF" != "develop" ]; then
            echo "Release pull requests must come from develop" >&2
            exit 1
          fi
          if [ "$PR_HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "Release pull requests must come from this repository" >&2
            exit 1
          fi
          case "$MERGE_SHA" in
            '' | *[!0-9a-f]*)
              echo "The merge commit is not a lowercase hex commit id" >&2
              exit 1
              ;;
          esac
          if [ "${#MERGE_SHA}" -ne 40 ]; then
            echo "The merge commit is not 40 characters long" >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$MERGE_SHA" ]; then
            echo "The checked-out commit is not the merge commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$MERGE_SHA" origin/main; then
            echo "The merge commit is not on main" >&2
            exit 1
          fi

      - name: Version
        id: version
        run: |
          if ! RELEASE_VERSION="$(git tag --list 'v*' | sh .github/scripts/release-version.sh "$PR_TITLE")"; then
            echo "The release pull request title must be exactly 'release vX.Y.Z' for a new version" >&2
            exit 1
          fi
          RELEASE_TARGET="$MERGE_SHA"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TARGET=$RELEASE_TARGET" >> "$GITHUB_OUTPUT"

  macos-tests:
    # The normal build (no version override): the tests expect the version "dev".
    needs: version
    runs-on: macos-15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.release_target }}
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        env:
          NuGetPackageSourceCredentials_github: Username=github;Password=${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore

      - name: Check the RoomKit package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(sed -n 's/.*<PackageReference Include="RoomKit" Version="\[\([0-9][0-9.]*\)\]".*/\1/p' src/PRWatch/PRWatch.csproj)
          if [ -z "$version" ]; then
            echo "No pinned RoomKit version in src/PRWatch/PRWatch.csproj." >&2
            exit 1
          fi
          package="${NUGET_PACKAGES:-$HOME/.nuget/packages}/roomkit/$version/roomkit.$version.nupkg"
          if [ ! -f "$package" ] || [ -L "$package" ]; then
            echo "RoomKit.$version.nupkg is not in the restored packages." >&2
            exit 1
          fi
          actual=$(shasum -a 256 "$package" | awk '{ print $1 }')
          pinned=""
          if [ -f roomkit.sha256 ]; then
            pinned=$(awk -v name="RoomKit.$version.nupkg" 'NR == 1 && NF == 2 && $2 == name { hash = $1 } END { if (NR == 1) print hash }' roomkit.sha256)
          fi
          if [ -z "$pinned" ] || [ "$pinned" != "$actual" ]; then
            echo "RoomKit.$version.nupkg does not match roomkit.sha256." >&2
            exit 1
          fi
          # Every attestation must come from roomkit's release.yml on main, run by a merged pull request on a
          # GitHub-hosted runner; true only then.
          if ! verified=$(gh attestation verify "$package" --repo nothisisnotdaniel/roomkit --cert-identity https://github.com/nothisisnotdaniel/roomkit/.github/workflows/release.yml@refs/heads/main --cert-oidc-issuer https://token.actions.githubusercontent.com --source-ref refs/heads/main --deny-self-hosted-runners --format json --jq 'length > 0 and all(.[]; .verificationResult.signature.certificate | .githubWorkflowTrigger == "pull_request" and .sourceRepositoryRef == "refs/heads/main" and .runnerEnvironment == "github-hosted")') || [ "$verified" != "true" ]; then
            echo "RoomKit.$version.nupkg has no valid roomkit release attestation." >&2
            exit 1
          fi

      - name: Build
        run: dotnet build -warnaserror --no-restore

      - name: Test
        run: dotnet test --no-build

  macos:
    needs: [version, macos-tests]
    runs-on: macos-15
    permissions:
      contents: read
      packages: read
    outputs:
      tarball_sha256: ${{ steps.hash.outputs.tarball_sha256 }}
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.release_target }}
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        env:
          NuGetPackageSourceCredentials_github: Username=github;Password=${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore src/PRWatch -r osx-arm64

      - name: Check the RoomKit package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(sed -n 's/.*<PackageReference Include="RoomKit" Version="\[\([0-9][0-9.]*\)\]".*/\1/p' src/PRWatch/PRWatch.csproj)
          if [ -z "$version" ]; then
            echo "No pinned RoomKit version in src/PRWatch/PRWatch.csproj." >&2
            exit 1
          fi
          package="${NUGET_PACKAGES:-$HOME/.nuget/packages}/roomkit/$version/roomkit.$version.nupkg"
          if [ ! -f "$package" ] || [ -L "$package" ]; then
            echo "RoomKit.$version.nupkg is not in the restored packages." >&2
            exit 1
          fi
          actual=$(shasum -a 256 "$package" | awk '{ print $1 }')
          pinned=""
          if [ -f roomkit.sha256 ]; then
            pinned=$(awk -v name="RoomKit.$version.nupkg" 'NR == 1 && NF == 2 && $2 == name { hash = $1 } END { if (NR == 1) print hash }' roomkit.sha256)
          fi
          if [ -z "$pinned" ] || [ "$pinned" != "$actual" ]; then
            echo "RoomKit.$version.nupkg does not match roomkit.sha256." >&2
            exit 1
          fi
          # Every attestation must come from roomkit's release.yml on main, run by a merged pull request on a
          # GitHub-hosted runner; true only then.
          if ! verified=$(gh attestation verify "$package" --repo nothisisnotdaniel/roomkit --cert-identity https://github.com/nothisisnotdaniel/roomkit/.github/workflows/release.yml@refs/heads/main --cert-oidc-issuer https://token.actions.githubusercontent.com --source-ref refs/heads/main --deny-self-hosted-runners --format json --jq 'length > 0 and all(.[]; .verificationResult.signature.certificate | .githubWorkflowTrigger == "pull_request" and .sourceRepositoryRef == "refs/heads/main" and .runnerEnvironment == "github-hosted")') || [ "$verified" != "true" ]; then
            echo "RoomKit.$version.nupkg has no valid roomkit release attestation." >&2
            exit 1
          fi

      # MSBuild reads every environment variable as a property, ignoring case, so a name like VERSION would
      # become $(Version) here. That is why the names are RELEASE_VERSION and RELEASE_TARGET.
      - name: Publish
        run: dotnet publish src/PRWatch -c Release -r osx-arm64 --self-contained --no-restore -p:Version="$RELEASE_VERSION" -o "$RUNNER_TEMP/publish"

      - name: Smoke check the published app
        run: |
          ACTUAL="$("$RUNNER_TEMP/publish/PRWatch" version)"
          if [ "$ACTUAL" != "PRWatch $RELEASE_VERSION" ]; then
            echo "PRWatch version printed '$ACTUAL', expected 'PRWatch $RELEASE_VERSION'" >&2
            exit 1
          fi

      - name: Pack
        env:
          # No ._ AppleDouble entries for extended attributes: the tarball holds only the publish output.
          COPYFILE_DISABLE: "1"
        run: |
          NAME="prwatch-$RELEASE_VERSION-osx-arm64"
          mkdir -p "$RUNNER_TEMP/pack" dist
          mv "$RUNNER_TEMP/publish" "$RUNNER_TEMP/pack/$NAME"
          if [ ! -f "$RUNNER_TEMP/pack/$NAME/wwwroot/index.html" ]; then
            echo "The publish output has no wwwroot/index.html" >&2
            exit 1
          fi
          # The updater installs this copy of itself with the release it swaps in (#9 adds the script).
          if [ -L scripts/updater.sh ]; then
            echo "scripts/updater.sh is a symlink" >&2
            exit 1
          fi
          if [ -f scripts/updater.sh ]; then
            cp scripts/updater.sh "$RUNNER_TEMP/pack/$NAME/updater.sh"
            chmod 0755 "$RUNNER_TEMP/pack/$NAME/updater.sh"
          else
            echo "::warning::scripts/updater.sh is missing, so this tarball ships without the updater"
          fi
          tar -czf "dist/$NAME.tar.gz" -C "$RUNNER_TEMP/pack" "$NAME"

      # The release job checks the downloaded tarball against this hash, which travels as a job output, apart
      # from the artifact store.
      - name: Hash the tarball
        id: hash
        run: |
          set -o pipefail
          TARBALL_SHA256="$(shasum -a 256 "dist/prwatch-$RELEASE_VERSION-osx-arm64.tar.gz" | cut -d ' ' -f 1)"
          echo "tarball_sha256=$TARBALL_SHA256" >> "$GITHUB_OUTPUT"

      - name: Save the tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-release
          path: dist/prwatch-${{ env.RELEASE_VERSION }}-osx-arm64.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [version, macos]
    # Builds nothing: it checks, sums, attests and publishes the tarball the macos job made.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
      RELEASE_TARGET: ${{ needs.version.outputs.release_target }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.release_target }}
          persist-credentials: false

      - name: Collect the build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-release
          path: dist

      # Exactly the tarball, byte-identical to what macos hashed before the upload. The hash comes from the job
      # output, a separate channel from the artifact store, and reaches the shell only through env:; it must be
      # 64 lower-case hex characters before it is compared.
      - name: Check the downloaded files
        env:
          TARBALL_SHA256: ${{ needs.macos.outputs.tarball_sha256 }}
        run: |
          TARBALL="prwatch-$RELEASE_VERSION-osx-arm64.tar.gz"
          if [ ! -f "dist/$TARBALL" ] || [ -L "dist/$TARBALL" ]; then
            echo "The downloaded artifact has no file $TARBALL" >&2
            exit 1
          fi
          for entry in dist/* dist/.[!.]* dist/..?*; do
            if [ ! -e "$entry" ] && [ ! -L "$entry" ]; then
              continue
            fi
            if [ "${entry#dist/}" != "$TARBALL" ]; then
              echo "The downloaded artifact holds an unexpected file: ${entry#dist/}" >&2
              exit 1
            fi
          done
          case "$TARBALL_SHA256" in
            '' | *[!0-9a-f]*)
              echo "The reported hash of $TARBALL is not 64 lower-case hex characters" >&2
              exit 1
              ;;
          esac
          if [ "${#TARBALL_SHA256}" -ne 64 ]; then
            echo "The reported hash of $TARBALL is not 64 lower-case hex characters" >&2
            exit 1
          fi
          # No pipe, so a failed shasum fails the step itself.
          if ! ACTUAL="$(shasum -a 256 "dist/$TARBALL")"; then
            echo "Could not hash dist/$TARBALL" >&2
            exit 1
          fi
          ACTUAL="${ACTUAL%% *}"
          if [ "$ACTUAL" != "$TARBALL_SHA256" ]; then
            echo "dist/$TARBALL does not match the hash its build job reported" >&2
            exit 1
          fi

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 "prwatch-$RELEASE_VERSION-osx-arm64.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/prwatch-${{ env.RELEASE_VERSION }}-osx-arm64.tar.gz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Left unquoted below on purpose: when empty it must add no argument at all.
          PRERELEASE=""
          case "$RELEASE_VERSION" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "v$RELEASE_VERSION" "dist/prwatch-$RELEASE_VERSION-osx-arm64.tar.gz" dist/SHA256SUMS --title "PRWatch $RELEASE_VERSION" --generate-notes --target "$RELEASE_TARGET" $PRERELEASE
